services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: ["redis-server",'--appendonly',"yes"]
    volumes:
      - redis-data:/data

  mongodb:
    image: mongo:7
    container_name: mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: mongo_redis_db
    volumes:
      - mongodb:/data/db

volumes:
  redis-data:
  mongodb:

